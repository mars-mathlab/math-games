<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24 點挑戰</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#fff;font-family:system-ui,sans-serif;text-align:center}main{max-width:1200px;margin:auto;padding:4vh 3vw}h1{font-size:clamp(28px,4vw,58px);margin:0 0 2vh}button,select{font:inherit;font-size:clamp(16px,2vw,26px);padding:12px 20px;border:0;border-radius:10px;margin:5px;cursor:pointer}button{background:#e2e8f0;color:#17233a}button.primary{background:#fbbf24}#cards{display:flex;gap:2vw;justify-content:center;margin:5vh 0}#cards b{background:#fff;color:#16243c;border-radius:18px;width:20%;padding:3vh 0;font-size:clamp(50px,12vw,160px)}#answer{font-size:clamp(24px,4vw,54px);min-height:1.6em;color:#fbbf24}#meta{font-size:25px;color:#cbd5e1}small{color:#cbd5e1}#cards{margin:2vh 0}#cards button{background:white;color:#16243c;width:22%;margin:0;padding:1vh 0;font-size:clamp(38px,9vw,100px);font-weight:bold}#cards button:disabled{opacity:.25;cursor:default}#expr{background:#24344f;border:1px solid #52627b;border-radius:12px;padding:12px;min-height:65px;font-size:clamp(24px,4vw,44px);overflow-wrap:anywhere}#ops{display:flex;flex-wrap:wrap;justify-content:center}#ops button{min-width:48px;font-size:28px;padding:8px 15px}#feedback{min-height:1.6em;font-size:clamp(18px,3vw,28px)}#answer{margin:8px 0}main{padding:2vh 3vw}button:focus-visible{outline:3px solid #fbbf24} @media(max-width:600px){button,select{padding:9px 12px;margin:3px}#ops button{min-width:42px;padding:7px 10px}#meta{font-size:18px}}</style><main><h1>24 點數學挑戰</h1><select id="level"><option value="-1">全部 100 題</option><option value="0">暖身 1–25</option><option value="1">進階 26–50</option><option value="2">高手 51–75</option><option value="3">挑戰 76–100</option></select><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">全螢幕</button><div id="meta"></div><div id="cards"></div><div id="expr" aria-live="polite">請點選數字組成算式</div><div id="ops"></div><div><button onclick="undo()">⌫ 退格</button><button onclick="clearExpr()">清除</button><button class="primary" onclick="submitExpr()">提交答案</button></div><div id="feedback" role="status"></div><p id="answer"></p><button onclick="move(-1)">上一題</button><button class="primary" onclick="move(1)">下一題</button><button onclick="randomQ()">隨機出題</button><button onclick="reveal()">顯示／隱藏答案</button><button onclick="reset()">重置</button><p><small>方向鍵切題｜空白鍵揭曉｜Enter 提交｜隨機出題不重複，直到本區題庫用完</small></p></main><script>const data=[[[1, 3, 3, 5], "(1×3)×(3+5)"], [[3, 3, 5, 5], "(5×5)−(3÷3)"], [[1, 6, 6, 6], "(6×(6−1))−6"], [[4, 4, 5, 5], "(5×5)−(4÷4)"], [[3, 3, 4, 4], "(3×4)+(3×4)"], [[2, 2, 4, 5], "(2+2)+(4×5)"], [[2, 2, 2, 5], "2×(2+(2×5))"], [[1, 2, 4, 5], "4×(5−(1−2))"], [[1, 3, 6, 6], "6+(6×(1×3))"], [[3, 4, 6, 6], "(3×4)+(6+6)"], [[2, 2, 5, 5], "(5×5)−(2÷2)"], [[3, 3, 3, 6], "(3+3)+(3×6)"], [[3, 3, 4, 5], "4×(5+(3÷3))"], [[1, 2, 4, 4], "(1+2)×(4+4)"], [[4, 4, 4, 5], "4×(5+(4÷4))"], [[3, 5, 5, 6], "(3×(5+5))−6"], [[2, 4, 4, 6], "6×((2×4)−4)"], [[2, 2, 3, 4], "3×(4+(2+2))"], [[4, 4, 4, 4], "(4+4)+(4×4)"], [[3, 4, 4, 4], "(4×(3+4))−4"], [[2, 3, 4, 6], "(3−2)×(4×6)"], [[4, 5, 5, 6], "6×((4+5)−5)"], [[2, 3, 4, 4], "4+(4×(2+3))"], [[2, 2, 2, 3], "(2+2)×(2×3)"], [[1, 3, 3, 6], "3×(6−(1−3))"], [[1, 1, 6, 9], "6+(9×(1+1))"], [[2, 2, 6, 7], "6+(2×(2+7))"], [[1, 6, 6, 9], "6×(9+(1−6))"], [[2, 4, 8, 8], "(2×4)+(8+8)"], [[3, 5, 5, 9], "3×(9−(5÷5))"], [[1, 3, 4, 4], "(1×3)×(4+4)"], [[1, 6, 8, 8], "8×(8+(1−6))"], [[4, 6, 6, 9], "6−(9×(4−6))"], [[6, 8, 9, 9], "(9+9)÷(6÷8)"], [[1, 4, 4, 6], "(4×(1+6))−4"], [[1, 8, 8, 8], "(1×8)+(8+8)"], [[2, 2, 2, 8], "(2+2)×(8−2)"], [[5, 5, 6, 8], "(5+5)+(6+8)"], [[1, 5, 7, 9], "(1−7)×(5−9)"], [[2, 7, 7, 8], "(2+7)+(7+8)"], [[3, 5, 6, 8], "(6×8)÷(5−3)"], [[3, 8, 9, 9], "(3×8)+(9−9)"], [[1, 2, 7, 9], "(2×9)−(1−7)"], [[4, 5, 8, 8], "8×(5−(8÷4))"], [[4, 8, 9, 9], "8×(4−(9÷9))"], [[1, 4, 4, 8], "8+(4×(1×4))"], [[4, 7, 7, 7], "4×(7−(7÷7))"], [[1, 3, 5, 9], "9+(5×(1×3))"], [[2, 4, 5, 9], "(2+4)×(9−5)"], [[1, 7, 8, 8], "(1+7)+(8+8)"], [[5, 5, 11, 11], "(5×5)−(11÷11)"], [[8, 9, 11, 11], "(11×(11−8))−9"], [[9, 11, 12, 13], "(9+13)÷(11÷12)"], [[8, 8, 10, 12], "8−(8×(10−12))"], [[4, 4, 7, 12], "(4−7)×(4−12)"], [[4, 6, 9, 13], "(9+13)−(4−6)"], [[6, 8, 10, 12], "(6×8)÷(12−10)"], [[4, 5, 6, 8], "8×((4+5)−6)"], [[6, 8, 8, 9], "(8×9)−(6×8)"], [[6, 6, 8, 12], "(6×6)×(8÷12)"], [[5, 5, 8, 10], "(5+10)÷(5÷8)"], [[7, 9, 11, 11], "(11+11)−(7−9)"], [[4, 4, 5, 7], "4×(7+(4−5))"], [[8, 10, 12, 13], "(10×12)÷(13−8)"], [[4, 7, 10, 10], "4×(7−(10÷10))"], [[4, 5, 7, 10], "4−(10×(5−7))"], [[4, 5, 10, 10], "4+(10÷(5÷10))"], [[7, 7, 7, 12], "(7+7)÷(7÷12)"], [[5, 5, 7, 10], "(5+7)÷(5÷10)"], [[8, 9, 10, 12], "(8+10)÷(9÷12)"], [[4, 10, 10, 12], "4−(10×(10−12))"], [[5, 7, 9, 11], "(5+7)×(11−9)"], [[5, 5, 9, 9], "(5×5)−(9÷9)"], [[6, 11, 11, 12], "(12÷6)+(11+11)"], [[4, 7, 8, 11], "8−(4×(7−11))"], [[3, 5, 8, 11], "(3+5)×(11−8)"], [[3, 6, 8, 13], "(8+13)−(3−6)"], [[1, 2, 3, 13], "(1−3)+(2×13)"], [[3, 4, 4, 13], "(3+4)+(4+13)"], [[2, 3, 11, 11], "(2−11)+(3×11)"], [[2, 10, 11, 12], "(2×11)−(10−12)"], [[3, 3, 8, 12], "(3+3)×(12−8)"], [[2, 8, 13, 13], "8×(2+(13÷13))"], [[1, 4, 9, 12], "(9×(1×4))−12"], [[1, 5, 9, 11], "(9+11)−(1−5)"], [[1, 7, 10, 13], "(1+7)×(13−10)"], [[1, 4, 12, 12], "(12×(4−1))−12"], [[3, 7, 8, 12], "12×((3+7)−8)"], [[1, 3, 3, 12], "12+(3×(1+3))"], [[3, 3, 4, 13], "(3×(13−4))−3"], [[1, 7, 9, 12], "(1+7)×(12−9)"], [[2, 7, 7, 12], "12×((2+7)−7)"], [[1, 5, 9, 10], "(1×5)+(9+10)"], [[1, 4, 9, 10], "(1+4)+(9+10)"], [[1, 4, 10, 12], "(10×12)÷(1+4)"], [[1, 3, 12, 12], "(12×(1×3))−12"], [[2, 4, 6, 11], "(2×11)−(4−6)"], [[2, 5, 6, 12], "(6×12)÷(5−2)"], [[1, 3, 8, 10], "(10−1)÷(3÷8)"], [[2, 2, 7, 12], "(2×7)−(2−12)"]];let tokens=[];let i=0,seen=new Set(),show=false;const el=x=>document.getElementById(x);function bounds(){let l=+el('level').value;return l<0?[0,100]:[l*25,l*25+25]}function draw(){seen.add(i);show=false;el('meta').textContent=`第 ${i+1} 題 / 100`;clearExpr();el('answer').textContent='　'}function move(d){let [a,b]=bounds();i=a+(i-a+d+b-a)%(b-a);draw()}function randomQ(){let [a,b]=bounds();let p=Array.from({length:b-a},(_,k)=>a+k).filter(k=>!seen.has(k));if(!p.length){seen.clear();p=Array.from({length:b-a},(_,k)=>a+k).filter(k=>k!==i)}i=p[Math.floor(Math.random()*p.length)];draw()}function reveal(){show=!show;el('answer').textContent=show?data[i][1]+' = 24':'　'}function reset(){seen.clear();i=bounds()[0];draw()}function renderExpr(){el('cards').innerHTML=data[i][0].map((n,k)=>`<button onclick="addNum(${k})" ${tokens.some(t=>t.k===k)?'disabled':''}>${n}</button>`).join('');el('expr').textContent=tokens.map(t=>t.v).join(' ')||'請點選數字組成算式';el('feedback').textContent=''}
function addNum(k){if(!tokens.some(t=>t.k===k)){tokens.push({k,v:data[i][0][k]});renderExpr()}}
function addOp(v){if(tokens.length<60){tokens.push({v});renderExpr()}}
function undo(){tokens.pop();renderExpr()}function clearExpr(){tokens=[];renderExpr()}
function evaluate(ts){let p=0;const err=()=>{throw Error('算式格式不正確，請檢查運算符號與括號')};function atom(){let t=ts[p++];if(!t)err();if(typeof t.v==='number')return [BigInt(t.v),1n];if(t.v==='('){let a=sum();if(ts[p++]?.v!==')')err();return a}if(t.v==='−'){let a=atom();return [-a[0],a[1]]}err()}function term(){let a=atom();while(['×','÷'].includes(ts[p]?.v)){let op=ts[p++].v,b=atom();if(op==='÷'&&b[0]===0n)throw Error('不能除以零');a=op==='×'?[a[0]*b[0],a[1]*b[1]]:[a[0]*b[1],a[1]*b[0]]}return a}function sum(){let a=term();while(['+','−'].includes(ts[p]?.v)){let op=ts[p++].v,b=term();a=[a[0]*b[1]+(op==='+'?1n:-1n)*b[0]*a[1],a[1]*b[1]]}return a}let a=sum();if(p!==ts.length)err();return a}
function submitExpr(){let f=el('feedback');try{if(tokens.filter(t=>typeof t.k==='number').length!==4)throw Error('請將四張數字卡各使用一次');let [n,d]=evaluate(tokens);if(n===24n*d){f.style.color='#86efac';f.textContent='答對了！恭喜你得到 24！'}else{f.style.color='#fbbf24';f.textContent='目前結果：'+Number(n)/Number(d)+'，再試試看！'}}catch(e){f.style.color='#fbbf24';f.textContent=e.message}}
for(let v of ['+','−','×','÷','(',')']){let b=document.createElement('button');b.textContent=v;b.onclick=()=>addOp(v);el('ops').append(b)}
el('level').onchange=reset;document.addEventListener('keydown',e=>{if(['BUTTON','SELECT'].includes(e.target.tagName))return;if(e.key==='Enter')submitExpr();if(e.key==='Backspace'){e.preventDefault();undo()}if(e.key==='Escape')clearExpr();if(['+','-','*','/','(',')'].includes(e.key))addOp(({ '-':'−','*':'×','/':'÷'})[e.key]||e.key);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();reveal()}});draw()</script></html>
